# /etc/nginx/sites-available/bluelake-agent.conf
# Final HTTPS site. Replace YOUR_DOMAIN before installing.
# The HTTP-only bootstrap is deploy/myapp.nginx.http.conf.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Keep ACME renewal reachable while all ordinary HTTP is redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    root /opt/bluelake-agent/web/dist;
    index index.html;

    # ChatRequest allows up to 1MB of text and export_file allows 2MB of
    # Markdown; leave room for JSON and headers without allowing huge bodies.
    client_max_body_size 4m;
    client_body_timeout 60s;
    send_timeout 1h;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Do not let the SPA fallback hide an unknown API root.
    location = /api {
        return 404;
    }

    # Keep /api/files/<opaque-id> and POST /api/chat on the FastAPI side.
    # The missing trailing slash on proxy_pass preserves the /api prefix.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        # FastAPI emits X-Accel-Buffering: no as well; keep this explicit so
        # SSE text_delta/tool events are flushed immediately.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_redirect off;
    }

    # Vite history fallback for client-side routes. Missing API paths never
    # reach this block because /api/ is a higher-priority prefix location.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite assets are content-addressed and can be cached safely. Do not let a
    # missing asset fall back to index.html; it should be an ordinary 404.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        access_log off;
    }

    # The web root is the built dist directory; deny dotfiles defensively.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
