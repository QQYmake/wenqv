# /etc/nginx/sites-available/myapp.conf
# Install:
#   sudo cp deploy/myapp.nginx.conf /etc/nginx/sites-available/myapp.conf
#   sudo ln -s /etc/nginx/sites-available/myapp.conf /etc/nginx/sites-enabled/myapp.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN, and the two certificate paths.

# ---------- HTTP -> HTTPS redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # ACME challenge passthrough (if you later use webroot renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS main site ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/ssl/certs/YOUR_CERT.pem;
    ssl_certificate_key /etc/ssl/private/YOUR_KEY.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # Frontend SPA - served directly by nginx, not by FastAPI.
    root /opt/myapp/web/dist;
    index index.html;

    # API: proxy to uvicorn. NO trailing slash on proxy_pass so the /api
    # prefix is preserved (backend routes are mounted under /api).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade (project has no WS today, but harmless to keep).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming chat: disable buffering, long timeouts.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback: any non-file path -> index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching (Vite hashes filenames, so cache aggressively).
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}