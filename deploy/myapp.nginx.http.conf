# HTTP-only bootstrap for ACME webroot validation.
# Replace YOUR_DOMAIN before installing. Replace this file with
# myapp.nginx.conf after certbot has issued the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /opt/bluelake-agent/web/dist;
    index index.html;
    client_max_body_size 6m;
    client_body_timeout 60s;
    send_timeout 1h;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        try_files $uri =404;
        access_log off;
    }
}
